<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI English Speaking PWA</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4f46e5">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <div class="header-titles">
                <h1>AI English Speaking</h1>
                <p class="subtitle">Practice English with your AI conversation partner.</p>
            </div>
            
            <div class="selectors-container">
                <div class="select-group">
                    <label for="modeSelect">Mode</label>
                    <select id="modeSelect">
                        <option value="casual">Casual Conversation</option>
                        <option value="work">Work</option>
                        <option value="interview">Job Interview</option>
                        <option value="travel">Travel</option>
                        <option value="australia">Australia</option>
                    </select>
                </div>
                <div class="select-group">
                    <label for="levelSelect">Level</label>
                    <select id="levelSelect">
                        <option value="beginner">Beginner</option>
                        <option value="elementary">Elementary</option>
                        <option value="intermediate" selected>Intermediate</option>
                        <option value="advanced">Advanced</option>
                    </select>
                </div>
            </div>
        </header>

        <main class="chat-container" id="chatContainer">
            <div class="message ai-message">
                <div class="bubble">
                    Hey! How was your day?
                </div>
            </div>
        </main>

        <footer class="app-footer">
            <div id="statusText" class="status-text">🎙️ Tap to Speak</div>
            <button id="micBtn" class="mic-btn" aria-label="Microphone Button">
                🎙️
            </button>
            
            <details class="settings-section">
                <summary>Settings</summary>
                <div class="settings-content">
                    <p>AI Voice: <span>Default (Natural)</span></p>
                    <p>Auto-play Voice: <span>Enabled</span></p>
                </div>
            </details>
        </footer>
    </div>

    <script src="app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('Service Worker registered!', reg))
                    .catch(err => console.log('Service Worker registration failed:', err));
            });
        }
    </script>
</body>
</html>
